<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mantenimiento Mediese</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e3a5f" />
</head>
<body>
  <header>
    <span id="user-info">Cargando...</span>
    <button id="btn-logout">Salir</button>
  </header>

  <main>
    <!-- MENÚ -->
    <section id="view-menu">
      <h2>Menú</h2>
      <div class="menu-grid">
        <button id="btn-stock">Ver stock</button>
        <button id="btn-entrada">Entrada</button>
        <button id="btn-salida">Salida</button>
        <button id="btn-devolucion">Devolución</button>
        <button id="btn-transferencia">Transferencia</button>
        <button id="btn-movimientos">Movimientos</button>
        <button id="btn-refacciones">Refacciones</button>
        <button id="btn-proveedores">Proveedores</button>
        <button id="btn-ubicaciones">Ubicaciones</button>
        <button id="btn-alertas">Alertas stock</button>
        <button id="btn-reconstruir">Reconstruir stock</button>
      </div>
    </section>

    <!-- STOCK -->
    <section id="view-stock" class="hidden">
      <h2>Stock actual</h2>
      <div id="lista-stock"></div>
      <button class="btn-primary" onclick="App.volverAlMenu()">Volver</button>
    </section>

    <!-- MOVIMIENTO -->
    <section id="view-movimiento" class="hidden">
      <h2 id="mov-titulo">Movimiento</h2>
      <input type="hidden" id="mov-tipo" />
      <label>Referencia (OT, factura, etc.)</label>
      <input id="mov-referencia" placeholder="Ej. OT-2026-0001, Factura A-123" />
      <div id="grupo-proveedor">
        <label>Proveedor / Cliente</label>
        <div id="mov-proveedor-container"></div>
      </div>
      <div id="grupo-ubicacion-origen">
        <label>Ubicación origen</label>
        <select id="mov-ubicacion-origen"></select>
      </div>
      <div id="grupo-ubicacion-destino">
        <label>Ubicación destino</label>
        <select id="mov-ubicacion-destino"></select>
      </div>
      <h3>Líneas</h3>
      <div id="mov-lineas"></div>
      <button type="button" id="btn-agregar-linea" class="btn-primary">+ Agregar línea</button>
      <label>Notas</label>
      <textarea id="mov-notas" placeholder="Notas adicionales"></textarea>
      <div style="text-align:right; margin: 12px 0; font-size:18px;">
        <strong>Total: <span id="mov-total" style="color:#15803d;">$0.00</span></strong>
      </div>
      <button id="btn-guardar-mov" class="btn-primary">Guardar</button>
      <p id="mov-status" class="send-status"></p>
      <button class="btn-primary" onclick="App.volverAlMenu()" style="background:#6b7280;">Volver</button>
    </section>

    <!-- MOVIMIENTOS -->
    <section id="view-movimientos" class="hidden">
      <h2>Movimientos</h2>
      <div id="lista-movimientos"></div>
      <button class="btn-primary" onclick="App.volverAlMenu()">Volver</button>
    </section>

    <!-- REFACCIONES -->
    <section id="view-refacciones" class="hidden">
      <h2>Refacciones</h2>
      <div style="text-align:right; margin-bottom:12px;">
        <button class="btn-primary" id="btn-nueva-refaccion">+ Nueva refacción</button>
      </div>
      <input id="ref-buscar" placeholder="Buscar por código o descripción..." style="margin-bottom:12px;" />
      <div id="lista-refacciones"></div>
      <button class="btn-primary" onclick="App.volverAlMenu()" style="background:#6b7280;">Volver</button>
    </section>

    <!-- ALERTAS -->
    <section id="view-alertas" class="hidden">
      <h2>Alertas de stock</h2>
      <div id="lista-alertas"></div>
      <button class="btn-primary" onclick="App.volverAlMenu()">Volver</button>
    </section>

    <!-- PROVEEDORES -->
    <section id="view-proveedores" class="hidden">
      <h2>Proveedores</h2>
      <div style="text-align:right; margin-bottom:12px;">
      <button class="btn-primary" id="btn-nuevo-proveedor">+ Nuevo proveedor</button>
    </div>
      
  <input id="prov-buscar" placeholder="Buscar por código o razón social..." style="margin-bottom:12px;" />
  <div id="lista-proveedores"></div>
  <button class="btn-primary" onclick="App.volverAlMenu()" style="background:#6b7280;">Volver</button>
</section>

    <!-- UBICACIONES -->
    <section id="view-ubicaciones" class="hidden">
  <h2>Ubicaciones</h2>
  <div style="text-align:right; margin-bottom:12px;">
    <button class="btn-primary" id="btn-nueva-ubicacion">+ Nueva ubicación</button>
  </div>
  <input id="ubic-buscar" placeholder="Buscar por código o nombre..." style="margin-bottom:12px;" />
  <div id="lista-ubicaciones"></div>
  <button class="btn-primary" onclick="App.volverAlMenu()" style="background:#6b7280;">Volver</button>
</section>

    <!-- FORMULARIO REFACCIÓN -->
    <section id="view-refaccion-form" class="hidden">
      <h2 id="ref-form-titulo">Nueva refacción</h2>
      <input type="hidden" id="ref-form-modo" />
      <input type="hidden" id="ref-form-codigo-original" />

      <div class="form-grid">
        <div class="form-grupo">
          <label>Código *</label>
          <input id="ref-form-codigo" placeholder="Ej. REF-0011" />
        </div>
        <div class="form-grupo">
          <label>Descripción *</label>
          <input id="ref-form-descripcion" placeholder="Ej. Tornillo 1/4 x 2" />
        </div>

        <div class="form-grupo">
          <label>Unidad</label>
          <select id="ref-form-unidad">
            <option>PZ</option><option>KG</option><option>LT</option><option>MT</option>
            <option>JGO</option><option>CAJA</option><option>ROLLO</option><option>PAR</option>
          </select>
        </div>
        <div class="form-grupo">
          <label>Categoría</label>
          <select id="ref-form-categoria">
            <option>MECANICO</option><option>ELECTRICO</option><option>HIDRAULICO</option>
            <option>NEUMATICO</option><option>CONSUMIBLE</option><option>HERRAMIENTA</option>
            <option>EPP</option><option>OTROS</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Marca</label>
          <input id="ref-form-marca" placeholder="Ej. SKF" />
        </div>
        <div class="form-grupo">
          <label>Modelo</label>
          <input id="ref-form-modelo" placeholder="Ej. 6205-2RS" />
        </div>

        <div class="form-grupo">
          <label>Mínimo</label>
          <input id="ref-form-minimo" type="number" step="0.01" value="0" />
        </div>
        <div class="form-grupo">
          <label>Máximo</label>
          <input id="ref-form-maximo" type="number" step="0.01" value="0" />
        </div>

        <div class="form-grupo">
          <label>¿Maneja lote?</label>
          <select id="ref-form-maneja-lote">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>
        <div class="form-grupo">
          <label>Ubicación por defecto</label>
          <select id="ref-form-ubicacion"></select>
        </div>

        <div class="form-grupo form-grupo-ancho">
          <label>Proveedor habitual</label>
          <div id="ref-form-proveedor-container"></div>
        </div>

        <div class="form-grupo">
          <label>PU (sin IVA)</label>
          <input id="ref-form-pu" type="number" step="0.01" value="0" />
        </div>
        <div class="form-grupo">
          <label>IVA unitario</label>
          <input id="ref-form-iva" type="number" step="0.01" value="0" />
        </div>

        <div class="form-grupo">
          <label>Moneda</label>
          <select id="ref-form-moneda">
            <option value="MXN">MXN</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <div class="form-grupo">
          <label>Tipo de cambio (si USD)</label>
          <input id="ref-form-tipo-cambio" type="number" step="0.01" value="0" />
        </div>

        <div class="form-grupo form-grupo-ancho">
          <label>Notas</label>
          <textarea id="ref-form-notas" rows="2"></textarea>
        </div>
      </div>

      <p id="ref-form-status" class="send-status"></p>
      <div class="form-acciones">
        <button class="btn-secundario" onclick="App.volverARefacciones()">Cancelar</button>
        <button class="btn-primary" id="btn-guardar-refaccion">Guardar</button>
      </div>
    </section>

    <!-- LOADING -->
    <section id="view-loading" class="hidden">
      <p id="loading-text" style="text-align:center;padding:40px;color:#666;">Cargando...</p>
    </section>
  </main>

  <script src="app.js"></script>
  <script>App.initApp();</script>
</body>
</html>

    <!-- PROVEEDORES (modificado) -->
    <section id="view-proveedores" class="hidden">
      <h2>Proveedores</h2>
      <div style="text-align:right; margin-bottom:12px;">
        <button class="btn-primary" id="btn-nuevo-proveedor">+ Nuevo proveedor</button>
      </div>
      <input id="prov-buscar" placeholder="Buscar por código o razón social..." style="margin-bottom:12px;" />
      <div id="lista-proveedores"></div>
      <button class="btn-primary" onclick="App.volverAlMenu()" style="background:#6b7280;">Volver</button>
    </section>

    <!-- FORMULARIO PROVEEDOR -->
    <section id="view-proveedor-form" class="hidden">
      <h2 id="prov-form-titulo">Nuevo proveedor</h2>
      <input type="hidden" id="prov-form-modo" />
      <input type="hidden" id="prov-form-codigo-original" />

      <div class="form-grid">
        <div class="form-grupo">
          <label>Código *</label>
          <input id="prov-form-codigo" placeholder="Ej. PROV-004" />
        </div>
        <div class="form-grupo">
          <label>Razón social *</label>
          <input id="prov-form-razon" placeholder="Ej. Aceros del Norte SA" />
        </div>

        <div class="form-grupo">
          <label>RFC</label>
          <input id="prov-form-rfc" placeholder="Ej. ADN900101ABC" />
        </div>
        <div class="form-grupo">
          <label>Moneda</label>
          <select id="prov-form-moneda">
            <option value="MXN">MXN</option>
            <option value="USD">USD</option>
          </select>
        </div>

        <div class="form-grupo">
          <label>Contacto</label>
          <input id="prov-form-contacto" placeholder="Ej. Juan Pérez" />
        </div>
        <div class="form-grupo">
          <label>Teléfono</label>
          <input id="prov-form-telefono" placeholder="Ej. 7771234567" />
        </div>

        <div class="form-grupo">
          <label>Email</label>
          <input id="prov-form-email" type="email" placeholder="Ej. ventas@aceros.com" />
        </div>
        <div class="form-grupo">
          <label>Tiempo de entrega (días)</label>
          <input id="prov-form-tiempo" type="number" step="1" value="0" />
        </div>

        <div class="form-grupo form-grupo-ancho">
          <label>Notas</label>
          <textarea id="prov-form-notas" rows="2"></textarea>
        </div>
      </div>

      <p id="prov-form-status" class="send-status"></p>
      <div class="form-acciones">
        <button class="btn-secundario" onclick="App.volverAProveedores()">Cancelar</button>
        <button class="btn-primary" id="btn-guardar-proveedor">Guardar</button>
      </div>
    </section>

    <!-- UBICACIONES (modificado) -->
    <section id="view-ubicaciones" class="hidden">
      <h2>Ubicaciones</h2>
      <div style="text-align:right; margin-bottom:12px;">
        <button class="btn-primary" id="btn-nueva-ubicacion">+ Nueva ubicación</button>
      </div>
      <input id="ubic-buscar" placeholder="Buscar por código o nombre..." style="margin-bottom:12px;" />
      <div id="lista-ubicaciones"></div>
      <button class="btn-primary" onclick="App.volverAlMenu()" style="background:#6b7280;">Volver</button>
    </section>

    <!-- FORMULARIO UBICACIÓN -->
    <section id="view-ubicacion-form" class="hidden">
      <h2 id="ubic-form-titulo">Nueva ubicación</h2>
      <input type="hidden" id="ubic-form-modo" />
      <input type="hidden" id="ubic-form-codigo-original" />

      <div class="form-grid">
        <div class="form-grupo">
          <label>Código *</label>
          <input id="ubic-form-codigo" placeholder="Ej. ALMACEN_REF" />
        </div>
        <div class="form-grupo">
          <label>Nombre *</label>
          <input id="ubic-form-nombre" placeholder="Ej. Almacén Refacciones" />
        </div>

        <div class="form-grupo">
          <label>Tipo</label>
          <select id="ubic-form-tipo">
            <option value="ALMACEN">ALMACEN</option>
            <option value="TALLER">TALLER</option>
            <option value="VEHICULO">VEHICULO</option>
            <option value="OBRA">OBRA</option>
            <option value="OTRO">OTRO</option>
          </select>
        </div>
        <div class="form-grupo">
          <label>Responsable</label>
          <input id="ubic-form-responsable" placeholder="Ej. admin" />
        </div>
      </div>

      <p id="ubic-form-status" class="send-status"></p>
      <div class="form-acciones">
        <button class="btn-secundario" onclick="App.volverAUbicaciones()">Cancelar</button>
        <button class="btn-primary" id="btn-guardar-ubicacion">Guardar</button>
      </div>
    </section>
