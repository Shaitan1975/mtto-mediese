<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mantenimiento Mediese - Login</title>
  <link rel="stylesheet" href="styles.css?v=20261024a" />
  <link rel="icon" type="image/svg+xml" href="icono.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e3a5f" />
</head>
<body>
  <div class="login-container">
    <h1>Mantenimiento Mediese</h1>
    <form id="login-form">
      <input id="usuario" type="text" placeholder="Usuario" required autocomplete="username" />
      <input id="password" type="password" placeholder="Contraseña" required autocomplete="current-password" />
      <button type="submit">Entrar</button>
      <p id="error-msg" class="error"></p>
    </form>
  </div>
  <script src="app.js?v=20261024a"></script>
  <script>App.initLogin();</script>
</body>
</html>
